    <script>
      // ═══ THE THEME IS APPLIED BEFORE THE FIRST PAINT, ON PURPOSE ═══
      //
      // Doing it in React means one frame of the light theme on a dark-mode machine — a
      // white flash on arrival, and somebody opening this page at 3am is exactly the reader
      // that lands on hardest.
      //
      // Its own storage key, because its own origin: localStorage does not cross hosts, so
      // a choice made on the marketing site is not readable from here. src/components/theme.tsx
      // reads this class back rather than re-deriving the answer.
      try {
        var stored = localStorage.getItem('paygate-status-theme');
        var dark = stored ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {
        // A browser with storage disabled still gets the system preference below.
      }
    </script>
